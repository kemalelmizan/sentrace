default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("SENTRACE_DEV_DATABASE", "sentrace_development") %>

test:
  <<: *default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 16 } %>
  url: <%= ENV["DATABASE_URL"] %>
  database: <%= ENV.fetch("SENTRACE_TEST_DATABASE", "sentrace_test") %>
